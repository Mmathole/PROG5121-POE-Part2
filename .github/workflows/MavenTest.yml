name: Maven Automated Testing

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Show directory structure
        run: ls -R

      - name: Build project
        run: mvn -B clean package

      - name: Run tests
        run: mvn -B test