name: Maven Automated Testing

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Show repo structure (debug)
        run: find .

      - name: Build
        run: mvn -B clean package

      - name: Test
        run: mvn -B test